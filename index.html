<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kit de Finanzas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f3f4f6; color: #1f2937; min-height: 100vh; display: flex; justify-content: center; padding: 16px; }
    .container { width: 100%; max-width: 420px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 16px; }
    .title { font-size: 1.5rem; font-weight: bold; text-align: center; margin-bottom: 20px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 4px; }
    .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; color: white; }
    .btn-blue { background-color: #2563eb; }
    .btn-green { background-color: #16a34a; }
    .balance-box { background-color: #2563eb; color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 16px; }
    .balance-amount { font-size: 2rem; font-weight: bold; margin-top: 4px; }
    .row { display: flex; justify-content: space-around; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.2); }
    .header-user { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .btn-logout { background: none; border: none; color: #dc2626; font-weight: bold; cursor: pointer; text-decoration: underline; font-size: 0.85rem; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f3f4f6; font-size: 0.9rem; }
    .ingreso { color: #16a34a; font-weight: bold; }
    .gasto { color: #dc2626; font-weight: bold; }
    .btn-del { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1rem; margin-left: 8px; }
    .btn-del:hover { color: #dc2626; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <p style="text-align: center; color: #6b7280; margin-top: 40px;">Cargando aplicación...</p>
  </div>

  <script src="./app.js"></script>
</body>
</html>
